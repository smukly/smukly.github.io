    <style>
        /* Mały nagłówek na górze */
        .art-title-small {
            font-family: 'VT323', monospace;
            font-size: 2rem;
            color: #ff00ff;
            text-shadow:
                0 0 8px #ff00ff,
                0 0 16px #ff00ff,
                -3px -3px 0 #000,
                3px -3px 0 #000,
                -3px 3px 0 #000,
                3px 3px 0 #000;
            letter-spacing: 6px;
            text-align: center;
            margin: 0 0 40px 0;
            padding-top: 20px;
        }

        /* Kafelkowa galeria */
        .gallery-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            column-count: 3;
            column-gap: 12px;
        }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 10px;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid #ff00ff;
            box-shadow: 0 0 6px rgba(255, 0, 255, 0.3);
            transition: all 0.2s ease;
            image-rendering: pixelated;
            cursor: pointer; /* pokazuje, że można kliknąć */
        }

        .gallery-item img:hover {
            transform: scale(1.03);
            box-shadow: 0 0 14px rgba(255, 0, 255, 0.6);
        }

        @media (max-width: 1000px) { .gallery-container { column-count: 2; } }
        @media (max-width: 600px) { .gallery-container { column-count: 1; } }

        /* Lightbox z płynną animacją – retro styl */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border: 4px solid #fff;
            box-shadow: 0 0 30px #0f0;
            transform: scale(0.8);
            opacity: 0;
            transition: all 0.4s ease;
        }

        .lightbox.active img {
            transform: scale(1);
            opacity: 1;
        }

        .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            font-family: monospace;
            font-size: 60px;
            color: #0f0;
            text-shadow: 0 0 15px #0f0;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            color: #0ff;
            text-shadow: 0 0 20px #0ff;
            transform: scale(1.1);
        }
    </style>

        <img id="lightbox-img" src="" alt="Powiększone dzieło">
    </div>

    <script>
    function openLightbox(src) {
        const lightbox = document.getElementById('lightbox');
        const img = document.getElementById('lightbox-img');
        img.src = src;
        lightbox.classList.add('active');
    }

    function closeLightbox() {
        const lightbox = document.getElementById('lightbox');
        lightbox.classList.remove('active');
        setTimeout(() => {
            document.getElementById('lightbox-img').src = '';
        }, 400);
    }

    // Zamknij po kliknięciu w tło
    document.getElementById('lightbox').addEventListener('click', function(e) {
        if (e.target === this) closeLightbox();
    });
    </script>
