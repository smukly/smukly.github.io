    <style>
        .ascii-table {
            width: 100%;
            max-width: 920px;
            margin: 25px auto;
            font-family: 'VT323', monospace;
            color: #00ffff;
            text-align: left;
            border-collapse: collapse;
            letter-spacing: 1px;
            background: rgba(10, 0, 40, 0.75);
            border: 2px solid #ff00ff;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.4);
        }

        .ascii-table th, .ascii-table td {
            padding: 12px 16px;
            border: 1.5px solid #ff00ff;
        }

        .ascii-table thead th {
            background: rgba(120, 0, 180, 0.6);
            color: #ffff00;
            text-shadow: 0 0 8px #ffff00;
            text-transform: uppercase;
            font-size: 1.4em;
        }

        .ascii-table tbody td {
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }

        .ascii-table a {
            color: #00ffff;
            text-decoration: none;
        }

        .ascii-table a:hover {
            color: #ffff00;
            text-shadow: 0 0 12px #ffff00;
        }

        /* ── Neonowy, dwukolorowy tytuł z CRT liniami ── */
        .title-header {
            position: relative;
            font-family: 'VT323', monospace;
            font-size: 3.8em;
            text-align: center;
            margin: 50px 0 30px;
            letter-spacing: 8px;
            color: #ff00ff;
            text-shadow: 
                0 0 7px #ff00ff,
                0 0 15px #ff00ff,
                3px 3px 0 #00ffff,
                -2px -2px 0 #00ffff;
            animation: subtle-glitch 4s infinite alternate;
        }

        .title-header span {
            position: relative;
            z-index: 2;
        }

        .title-header::before,
        .title-header::after {
            content: "";
            position: absolute;
            left: 5%;
            right: 5%;
            height: 3px;
            background: rgba(255, 0, 255, 0.5);
            box-shadow: 0 0 12px rgba(255, 0, 255, 0.7);
        }

        .title-header::before { top: -18px; }
        .title-header::after  { bottom: -18px; }

        @keyframes subtle-glitch {
            0%, 100% { transform: translate(0, 0); }
            20%  { transform: translate(-1.5px, 1.5px); }
            40%  { transform: translate(1px, -1px); }
            60%  { transform: translate(-0.8px, 0.8px); }
        }

        .soon-text {
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            font-style: italic;
            text-align: center;
            padding: 12px;
        }
    </style>
