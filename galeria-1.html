    <link rel="stylesheet" href="style.css">
    <style>
        /* Mały nagłówek na górze */
        .art-title-small {
            font-family: 'VT323', monospace;
            font-size: 2rem;
            color: #ff00ff;
            text-shadow:
                0 0 8px #ff00ff,
                0 0 16px #ff00ff,
                -3px -3px 0 #000,
                3px -3px 0 #000,
                -3px 3px 0 #000,
                3px 3px 0 #000;
            letter-spacing: 6px;
            text-align: center;
            margin: 0 0 40px 0;
            padding-top: 20px;
        }
        /* Kafelkowa galeria – czysta, bez ramek */
        .gallery-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            column-count: 3;
            column-gap: 12px;
        }
        .gallery-item {
            break-inside: avoid;
            margin-bottom: 10px;
        }
        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid #ff00ff;
            box-shadow: 0 0 6px rgba(255, 0, 255, 0.3);
            transition: all 0.2s ease;
            image-rendering: pixelated;
            cursor: pointer; /* dodane – kursor pokazuje, że można kliknąć */
        }
        .gallery-item img:hover {
            transform: scale(1.03);
            box-shadow: 0 0 14px rgba(255, 0, 255, 0.6);
        }
        @media (max-width: 1000px) { .gallery-container { column-count: 2; } }
        @media (max-width: 600px) { .gallery-container { column-count: 1; } }
    </style>
</head>

    <!-- === DODANE: Lightbox retro === -->
    <div id="lightbox" class="lightbox">
        <span class="close-btn" onclick="closeLightbox()">X</span>
        <img id="lightbox-img" src="" alt="Powiększone dzieło">
    </div>

    <script>
    function openLightbox(src) {
        document.getElementById('lightbox-img').src = src;
        document.getElementById('lightbox').style.display = 'flex';
    }
    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
    }
    // Zamknij po kliknięciu w tło
    document.getElementById('lightbox').addEventListener('click', function(e) {
        if (e.target === this) closeLightbox();
    });
    </script>
    <!-- === KONIEC DODANEGO KODU === -->

</body>
